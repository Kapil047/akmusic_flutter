name: akmusic_flutter
description: Hardened, encrypted YouTube Music streaming and offline playback Flutter client
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & Cryptography
  dio: ^5.7.0
  cryptography: ^2.7.2
  convert: ^3.1.2

  # Audio Playback & Media Session
  just_audio: ^0.9.40
  audio_service: ^0.18.17
  audio_session: ^0.1.21

  # Caching, Storage & Security
  cached_network_image: ^3.4.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  uuid: ^4.5.1

  # UI & Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
